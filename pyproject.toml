[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qcompile"
version = "0.1.0"
description = "Auditable quantum compilation experiments and official Kaggle verification orchestration"
requires-python = ">=3.12,<3.15"
dependencies = ["numpy==2.3.5", "scipy==1.17.0", "pandas==2.2.3"]

[project.scripts]
qcompile = "qcompile.cli:main"

[dependency-groups]
dev = ["pytest==9.0.2", "mpmath==1.3.0", "ruff==0.14.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: extended independent numerical checks", "official: requires acquired official competition assets"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
