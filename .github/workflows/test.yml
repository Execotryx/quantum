name: Independent checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.4
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run qcompile test --tier extended
      - name: Confirm unresolved contract blocks release
        shell: bash
        run: |
          set +e
          uv run qcompile contract validate > contract-status.json
          status=$?
          set -e
          test "$status" -eq 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-status-${{ matrix.os }}
          path: contract-status.json
