[project]
name = "quantum-operations-plugin"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["mcp>=1.28,<2"]

[dependency-groups]
dev = ["pytest==9.0.2", "pyright>=1.1.414", "ruff==0.14.3"]

[tool.uv]
package = false

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
